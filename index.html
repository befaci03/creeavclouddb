<!DOCTYPE html>
<html>
<head><title>creeav official database</title></head>
<body>
<script>document.addEventListener("DOMContentLoaded", async () => {
  const elem__hashes = document.querySelector("div#hashes")
  elem__hashes.innerHTML ='<span id="hashCounter">Loading...</span><ul id="hashList"></ul>'
  const hashesReq = await fetch("hashes.txt", { method: "GET" });
  if (!hashesReq.ok) document.body.innerHTML = "hash db couldnt be found :("
  const hashesRes = (await hashesReq.text()).split('\n');
  const hashlist = hashesRes.filter(([_,v]) => !v.startsWith('#'));

  const elem__hashUl = document.querySelector("ul#hashList")
  const hashCount = document.querySelector("span#hashCounter");
  hashCount.innerText = `${hashlist.length} hashes loaded`
  elem__hashes.appendChild(hashCount);
  
  for (const hash in hashlist) {
    const helem = document.createElement("li")
    helem.textContent = hash;
    elem__hashUl.appendChild(helem);
  }
})</script>
